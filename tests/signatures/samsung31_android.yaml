browser:
  name: samsung
  version: 30.0.2.45
  os: android_16
  target: samsung31_android
signature:
  options:
    tls_permute_extensions: true
  http2:
    frames:
    - frame_type: SETTINGS
      settings:
      - key: 1
        value: 65536
      - key: 2
        value: 0
      - key: 4
        value: 6291456
      - key: 6
        value: 262144
      stream_id: 0
    - frame_type: WINDOW_UPDATE
      stream_id: 0
      window_size_increment: 15663105
    - frame_type: HEADERS
      stream_id: 1
      headers:
      - 'sec-ch-ua: "Samsung Internet";v="30.0", "Chromium";v="143", "Not A(Brand";v="24"'
      - 'sec-ch-ua-mobile: ?1'
      - 'sec-ch-ua-platform: "Android"'
      - 'upgrade-insecure-requests: 1'
      - 'user-agent: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML,
        like Gecko) SamsungBrowser/30.0 Chrome/143.0.0.0 Mobile Safari/537.36'
      - 'accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7'
      - 'sec-fetch-site: none'
      - 'sec-fetch-mode: navigate'
      - 'sec-fetch-user: ?1'
      - 'sec-fetch-dest: document'
      - 'accept-encoding: gzip, deflate, br'
      - 'accept-language: en-US,en;q=0.9'
      - 'priority: u=0, i'
      pseudo_headers:
      - :method
      - :authority
      - :scheme
      - :path
  tls_client_hello:
    partial: true
    ciphersuites:
    - 4865
    - 4866
    - 4867
    - 49195
    - 49199
    - 49196
    - 49200
    - 52393
    - 52392
    - 49171
    - 49172
    - 156
    - 157
    - 47
    - 53
    extensions:
    - type: signature_algorithms
      sig_hash_algs:
      - 1027
      - 2052
      - 1025
      - 1283
      - 2053
      - 1281
      - 2054
      - 1537
    - type: signed_certificate_timestamp
    - type: keyshare
    - type: status_request
    - type: ec_point_formats
    - type: encrypted_client_hello
    - type: application_settings_new
    - type: supported_groups
      supported_groups:
      - 4588
      - 29
      - 23
      - 24
    - type: renegotiation_info
    - type: compress_certificate
      algorithms:
      - 2
    - type: psk_key_exchange_modes
    - type: session_ticket
    - type: server_name
    - type: extended_master_secret
    - type: supported_versions
    - type: application_layer_protocol_negotiation
    grease: true
